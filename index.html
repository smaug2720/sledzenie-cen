<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prywatny Monitor Cen</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 480px;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1.5rem;
            text-align: center;
            color: #38bdf8;
        }
        .badge-wrapper {
            text-align: center;
            margin-bottom: 22px;
        }
        .badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            background-color: #334155;
            color: #cbd5e1;
        }
        .badge.active {
            background-color: rgba(34, 197, 94, 0.15);
            border: 1px solid #22c55e;
            color: #86efac;
        }
        .badge.stopped {
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }
        .field {
            margin-bottom: 18px;
        }
        .row {
            display: flex;
            gap: 12px;
        }
        .row .field {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #cbd5e1;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #f8fafc;
            font-size: 1rem;
            box-sizing: border-box;
            color-scheme: dark;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background-color: #0284c7;
            color: white;
            border: none;
            margin-bottom: 10px;
        }
        .btn-primary:hover {
            background-color: #0369a1;
        }
        .btn-stop {
            background-color: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
            border: 1px solid #ef4444;
        }
        .btn-stop:hover {
            background-color: #dc2626;
            color: white;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            line-height: 1.4;
        }
        .status.success {
            display: block;
            background-color: rgba(34, 197, 94, 0.15);
            border: 1px solid #22c55e;
            color: #86efac;
        }
        .status.error {
            display: block;
            background-color: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }
        .status.info {
            display: block;
            background-color: rgba(56, 189, 248, 0.15);
            border: 1px solid #38bdf8;
            color: #bae6fd;
        }
        .hint {
            font-size: 0.78rem;
            color: #94a3b8;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Prywatny Monitor Cen</h1>
        <div class="badge-wrapper">
            <span id="stateBadge" class="badge">Sprawdzanie statusu...</span>
        </div>

        <div class="field">
            <label for="urlInput">Link do produktu (Amazon)</label>
            <input type="url" id="urlInput" placeholder="https://www.amazon.pl/dp/..." required>
        </div>

        <div class="row">
            <div class="field">
                <label for="priceInput">Próg cenowy (zł)</label>
                <input type="number" id="priceInput" step="0.01" placeholder="np. 137.02" required>
            </div>
            <div class="field">
                <label for="timeInput">Godzina sprawdzania</label>
                <input type="time" id="timeInput" value="11:00" required>
            </div>
        </div>

        <div class="field">
            <label for="tokenInput">Klucz dostępu GitHub (wpisujesz tylko raz)</label>
            <input type="password" id="tokenInput" placeholder="github_pat_...">
            <div class="hint">Zapisuje się wyłącznie w pamięci Twojej przeglądarki.</div>
        </div>

        <button id="saveBtn" class="btn-primary" onclick="zapiszUstawienia(true)">Zapisz i uruchom sprawdzanie</button>
        <button id="stopBtn" class="btn-stop" onclick="zapiszUstawienia(false)">Zatrzymaj monitorowanie</button>
        <div id="statusBox" class="status"></div>
    </div>

    <script>
        const OWNER = "smaug2720";
        const REPO = "sledzenie-cen";
        const FILE_PATH = "config.json";
        const WORKFLOW_PATH = ".github/workflows/main.yml";

        function toBase64(str) {
            const bytes = new TextEncoder().encode(str);
            let binString = "";
            bytes.forEach((b) => binString += String.fromCharCode(b));
            return btoa(binString);
        }

        function fromBase64(b64) {
            const binString = atob(b64.replace(/\n/g, ""));
            const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
            return new TextDecoder().decode(bytes);
        }

        function ustawEtykieteStanu(czyAktywny) {
            const badge = document.getElementById("stateBadge");
            if (czyAktywny) {
                badge.textContent = "● Monitorowanie aktywne";
                badge.className = "badge active";
            } else {
                badge.textContent = "● Monitorowanie zatrzymane";
                badge.className = "badge stopped";
            }
        }

        function lokalnyCzasNaCronUTC(godzinaStr) {
            const [localHour, localMin] = godzinaStr.split(":").map(Number);
            const data = new Date();
            data.setHours(localHour, localMin, 0, 0);
            return `${data.getUTCMinutes()} ${data.getUTCHours()} * * *`;
        }

        window.onload = async () => {
            const zapisanyToken = localStorage.getItem("gh_monitor_token");
            if (zapisanyToken) {
                document.getElementById("tokenInput").value = zapisanyToken;
                await wczytajAktualneDane(zapisanyToken);
            } else {
                document.getElementById("stateBadge").textContent = "Wpisz klucz dostępu";
            }
        };

        function pokazStatus(tekst, typ) {
            const box = document.getElementById("statusBox");
            box.textContent = tekst;
            box.className = "status " + typ;
        }

        async function wczytajAktualneDane(token) {
            try {
                const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Accept": "application/vnd.github+json"
                    }
                });
                if (res.ok) {
                    const data = await res.json();
                    const config = JSON.parse(fromBase64(data.content));
                    document.getElementById("urlInput").value = config.url || "";
                    document.getElementById("priceInput").value = config.docelowa_cena || "";
                    document.getElementById("timeInput").value = config.godzina || "11:00";

                    const czyAktywny = config.aktywny !== false;
                    ustawEtykieteStanu(czyAktywny);

                    if (czyAktywny) {
                        pokazStatus("Wczytano aktualnie monitorowany produkt.", "info");
                    } else {
                        pokazStatus("Monitorowanie jest obecnie zatrzymane.", "info");
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function zapiszUstawienia(czyAktywowac) {
            const url = document.getElementById("urlInput").value.trim();
            const cenaRaw = parseFloat(document.getElementById("priceInput").value.replace(",", "."));
            const cena = isNaN(cenaRaw) ? 0 : cenaRaw;
            const godzina = document.getElementById("timeInput").value || "11:00";
            const token = document.getElementById("tokenInput").value.trim();
            const saveBtn = document.getElementById("saveBtn");
            const stopBtn = document.getElementById("stopBtn");

            if (!token) {
                pokazStatus("Wpisz klucz dostępu GitHub.", "error");
                return;
            }

            if (czyAktywowac && (!url || isNaN(cenaRaw) || !godzina)) {
                pokazStatus("Uzupełnij link do produktu, próg cenowy oraz godzinę.", "error");
                return;
            }

            localStorage.setItem("gh_monitor_token", token);
            saveBtn.disabled = true;
            stopBtn.disabled = true;
            pokazStatus("Zapisywanie ustawień i harmonogramu na GitHubie...", "info");

            const headers = {
                "Authorization": `Bearer ${token}`,
                "Accept": "application/vnd.github+json",
                "Content-Type": "application/json"
            };

            try {
                const repoRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}`, { headers });
                if (!repoRes.ok) throw new Error("Nieprawidłowy klucz dostępu lub brak uprawnień.");
                const repoData = await repoRes.json();
                const branch = repoData.default_branch;

                // 1. Zapis pliku config.json
                let sha = null;
                const fileRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, { headers });
                if (fileRes.ok) {
                    const fileData = await fileRes.json();
                    sha = fileData.sha;
                }

                const nowyConfig = JSON.stringify({
                    url: url,
                    docelowa_cena: cena,
                    godzina: godzina,
                    aktywny: czyAktywowac
                }, null, 2);

                const putBody = {
                    message: czyAktywowac ? "Aktualizacja produktu i godziny przez stronę WWW" : "Zatrzymanie monitorowania przez stronę WWW",
                    content: toBase64(nowyConfig),
                    branch: branch
                };
                if (sha) putBody.sha = sha;

                const putRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`, {
                    method: "PUT",
                    headers: headers,
                    body: JSON.stringify(putBody)
                });

                if (!putRes.ok) throw new Error("Nie udało się zapisać pliku config.json.");

                // 2. Aktualizacja godziny w harmonogramie main.yml i natychmiastowe sprawdzenie
                if (czyAktywowac) {
                    const wfRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${WORKFLOW_PATH}`, { headers });
                    if (wfRes.ok) {
                        const wfData = await wfRes.json();
                        const staryYaml = fromBase64(wfData.content);
                        const nowyCron = lokalnyCzasNaCronUTC(godzina);
                        const nowyYaml = staryYaml.replace(/cron:\s*'[^']*'/, `cron: '${nowyCron}'`);

                        if (nowyYaml !== staryYaml) {
                            const wfPutRes = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${WORKFLOW_PATH}`, {
                                method: "PUT",
                                headers: headers,
                                body: JSON.stringify({
                                    message: `Zmiana godziny sprawdzania na ${godzina}`,
                                    content: toBase64(nowyYaml),
                                    sha: wfData.sha,
                                    branch: branch
                                })
                            });
                            if (!wfPutRes.ok) {
                                throw new Error("Zapisano produkt, ale brak uprawnienia 'Workflows: Read and write' w tokenie do zmiany godziny.");
                            }
                        }
                    }

                    await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/main.yml/dispatches`, {
                        method: "POST",
                        headers: headers,
                        body: JSON.stringify({ ref: branch })
                    });

                    ustawEtykieteStanu(true);
                    pokazStatus(`Zapisano! Natychmiastowe sprawdzenie właśnie ruszyło, a kolejne będą odbywać się codziennie o ${godzina}.`, "success");
                } else {
                    ustawEtykieteStanu(false);
                    pokazStatus("Zatrzymano monitorowanie. Skrypt nie będzie już sprawdzał ceny tego produktu.", "success");
                }
            } catch (err) {
                pokazStatus("Błąd: " + err.message, "error");
            } finally {
                saveBtn.disabled = false;
                stopBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
